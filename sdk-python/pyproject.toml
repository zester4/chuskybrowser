[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chuskybrowser"
version = "1.21.0"
description = "Python client for chuskybrowser: open pages, read them, and hand them to a person for sign-in."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["chusky"]
